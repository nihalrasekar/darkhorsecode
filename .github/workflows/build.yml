name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: windows-latest, name: Windows, flag: --win }
          - { os: ubuntu-latest, name: Linux, flag: --linux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --publish never ${{ matrix.flag }}
      - uses: actions/upload-artifact@v4
        with:
          name: DarkHorseCode-${{ matrix.name }}
          path: |
            release/*.exe
            release/*.AppImage
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release/*.exe
            release/*.AppImage
